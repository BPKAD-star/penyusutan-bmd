# CI — REFACTOR-PLAN.md Fase 0.7.
#
# Sengaja MINIMAL: hanya yang sudah terbukti hijau di lokal. Menaruh langkah
# yang belum bisa jalan cuma menghasilkan CI merah permanen — efeknya sama
# dengan tidak punya CI, karena semua orang belajar mengabaikannya.
#
#   1. npm run typecheck  ← Fase 0.6, APA ADANYA (repo ini 0 error)
#   2. npm test           ← Fase 0.2–0.8, Fase 1, golden test — 1.302 test
#   3. npm run lint       ← Fase 0.5, terpasang 2026-08-06 (0 error, 597 warning)
#   4. npm run test:coverage ← ditambahkan 2026-09-15 (97,51% stmt / 87,68% branch)
#
# ⚠️ `typecheck` sengaja TANPA berkas baseline. Rencana awal membekukan error
# lama ke `.typecheck-baseline.txt`, tapi ternyata nol error bisa dicapai
# langsung — dan berkas baseline adalah tempat sempurna untuk menyembunyikan
# error baru. Kalau suatu saat ada yang menambahkannya, itu langkah MUNDUR:
# perbaiki errornya, jangan bekukan.
#
# Yang dijaga CI ini hari ini: 1.302 test di 57 berkas (tinjauan 2026-09-15),
# termasuk lib/sinkronisasi.test.ts
# yang menegakkan rules.md §1.7 & §5.5 — daftar konstanta kembar yang selama ini
# hanya dijaga ingatan dan sudah berkali-kali bocor. Sejak Fase 0.8 ia juga
# membandingkan shared/types/database.types.ts dengan migrasi, jadi menambah
# nilai enum tanpa `npm run gen:types` langsung merah.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck + unit test domain + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `npm ci` (bukan `npm install`) — dipasang persis dari package-lock.json,
      # jadi CI tak bisa diam-diam memakai versi paket yang berbeda dari lokal.
      - run: npm ci

      - run: npm run typecheck

      # lib/sinkronisasi.test.ts membaca supabase/migrations/*.sql lewat fs,
      # jadi checkout WAJIB memuat berkas migrasinya (default actions/checkout
      # sudah begitu — jangan pakai sparse-checkout di sini).
      - run: npm test

      # SENGAJA TANPA `--max-warnings`. Warning di sini = utang lama yang sudah
      # terukur & sengaja dibiarkan (597 per 2026-09-15: 301 floating promise,
      # 274 `const { data } = await`, 22 max-lines) — memerahkan
      # CI karenanya sama saja dengan tidak punya CI. Yang memerahkan CI cuma
      # yang berstatus `error`, dan itu semua dipilih dari kelompok yang HARI
      # INI nol pelanggaran. Rinciannya di eslint.config.mjs.
      - run: npm run lint

      # Coverage IKUT MEMERAHKAN CI sejak 2026-09-15. Sampai hari itu ia sengaja
      # tak dijalankan karena MERAH (67,83% < ambang 80%): tiga berkas shared/ui
      # yang lahir sesudah ambangnya dipasang tak pernah diberi test
      # (FotoBarang, KonfirmasiModal, konfirmasi — 0% ketiganya). Utang itu
      # dibayar, bukan ambangnya yang diturunkan — ketiganya justru primitif
      # yang dipakai MENYETUJUI & MEMBUKA KUNCI dokumen. Sesudahnya: 97,51%
      # statement / 87,68% branch.
      #
      # ⚠️ Ambangnya cuma berlaku untuk `coverage.include` di vitest.config.ts
      # (logika murni + shared), BUKAN seluruh repo. Melebarkan `include` ke
      # `components/**` akan memerahkan CI seketika — kalau itu dikerjakan,
      # turunkan ambangnya di commit yang SAMA, jangan biarkan merah menggantung
      # (CI merah permanen = semua orang belajar mengabaikannya).
      - run: npm run test:coverage
